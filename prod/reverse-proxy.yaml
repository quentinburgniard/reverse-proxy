apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reverse-proxy
  annotations:
    cert-manager.io/cluster-issuer: cert
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/server-snippet: |
      error_page 400 401 402 403 404 405 406 408 409 410 411 412 413 414 415 416 417 418 422 423 424 426 428 429 431 500 501 502 503 504 = /_error;

      location = /_error {
        internal;
        add_header Content-Length 0;
        return $status;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.preview.digitalleman.com
        - calendar.digitalleman.com
        - id.digitalleman.com
      secretName: cert
  rules:
    - host: api.preview.digitalleman.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
    - host: calendar.digitalleman.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calendar
                port:
                  number: 80
    - host: id.digitalleman.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: id
                port:
                  number: 80
