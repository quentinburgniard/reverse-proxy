apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reverse-proxy
  annotations:
    cert-manager.io/cluster-issuer: cert
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - files.digitalleman.com
        - api.preview.digitalleman.com
        - calendar.digitalleman.com
        - id.digitalleman.com
        - penny.digitalleman.com
      secretName: cert
  rules:
    - host: api.preview.digitalleman.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
    - host: calendar.digitalleman.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calendar
                port:
                  number: 80
    - host: id.digitalleman.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: id
                port:
                  number: 80
    - host: penny.digitalleman.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: penny
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: files
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /v5/files/$1
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - files.digitalleman.com
      secretName: cert
  rules:
    - host: files.digitalleman.com
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internal
  annotations:
    cert-manager.io/cluster-issuer: internal-cert
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/whitelist-source-range: "213.55.174.37/32"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: internal-auth
    nginx.ingress.kubernetes.io/auth-realm: "Internal"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - db.internal.digitalleman.com
      secretName: internal-cert
  rules:
    - host: db.internal.digitalleman.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: db-admin
                port:
                  number: 80
