apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  ports:
    - name: http
      port: 80
  selector:
    app: id
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/quentinburgniard/api:5.0.0
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
