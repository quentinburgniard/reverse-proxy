apiVersion: v1
kind: Service
metadata:
  name: db
labels:
  app: mariadb
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  clusterIP: None
  selector:
    app: mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: mariadb-secret
          ports:
            - containerPort: 3306
              name: mysql
          readinessProbe:
            exec: { command: ["bash","-c","mysqladmin ping -u root -p$MARIADB_ROOT_PASSWORD"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["bash","-c","mysqladmin ping -u root -p$MARIADB_ROOT_PASSWORD"] }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      securityContext:
        fsGroup: 999
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi